name: Build & Release TizenDLNA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to publish a GitHub Release (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 16 platform & build-tools
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore (if configured)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
            echo "Using persistent release signing keystore"
          else
            echo "WARNING: SIGNING_KEYSTORE_BASE64 secret not set; falling back to ephemeral debug key"
          fi

      - name: Build release APK (Android 10-16 / arm64-v8a)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Prepare release artifact & changelog
        id: meta
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          APK_NAME="TizenDLNA-${TAG}-arm64-v8a.apk"
          cp "$APK_PATH" "dist/${APK_NAME}"
          (cd dist && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")

          PREV_TAG=$(git describe --tags --abbrev=0 --exclude="${TAG}" 2>/dev/null || true)
          {
            echo "## Changelog"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)"
            else
              git log -n 10 --pretty=format:"- %s (%h)"
            fi
            echo ""
          } > dist/release-notes.md

          cat dist/release-notes.md
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TizenDLNA-${{ steps.meta.outputs.tag }}-arm64-v8a
          path: |
            dist/*.apk
            dist/*.sha256

      - name: Publish GitHub Release with APK & Changelog
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: TizenDLNA ${{ steps.meta.outputs.tag }}
          body_path: dist/release-notes.md
          files: |
            dist/*.apk
            dist/*.sha256

      - name: Prune old releases (keep latest 5)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_TAGS=$(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName')
          for tag in $OLD_TAGS; do
            echo "Deleting old release and tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done
