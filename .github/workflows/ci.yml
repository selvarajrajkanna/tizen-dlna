name: Build & Release TizenDLNA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to publish a GitHub Release (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK (Android 16 / arm64-v8a)
        run: gradle assembleRelease --no-daemon

      - name: Prepare release artifact
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" dist/TizenDLNA-arm64-v8a-android16.apk
          (cd dist && sha256sum TizenDLNA-arm64-v8a-android16.apk > TizenDLNA-arm64-v8a-android16.apk.sha256)
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TizenDLNA-arm64-v8a-android16
          path: dist/*

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/TizenDLNA-arm64-v8a-android16.apk
            dist/TizenDLNA-arm64-v8a-android16.apk.sha256
